<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ollama Translator</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="../shared/theme-page.js"></script>
    <script type="module" src="popup.js"></script>
    <script type="module" src="../summary/popup.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">✦</span>
        <div><h1>Ollama Translator</h1><p class="subtitle">Your local text workspace</p></div>
      </div>
      <div class="header-buttons">
        <button id="refresh" class="icon-button" type="button" title="Check again" aria-label="Check again">⟳</button>
        <button id="options" class="settings-button" type="button" title="Open settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M10 2h4l.5 3 1.5.6L18.5 4 20 5.5 18.4 8l.6 1.5 3 .5v4l-3 .5-.6 1.5 1.6 2.5-1.5 1.5-2.5-1.6-1.5.6-.5 3h-4l-.5-3-1.5-.6L5.5 20 4 18.5 5.6 16 5 14.5 2 14v-4l3-.5L5.6 8 4 5.5 5.5 4 8 5.6 9.5 5Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span>Settings</span>
        </button>
      </div>
    </header>

    <section id="status" class="status" data-kind="checking">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Checking Ollama…</span>
    </section>
    <div id="hint" class="hint" hidden>
      <p id="hint-text"></p>
      <code id="hint-code" hidden></code>
    </div>

    <div class="field">
      <div class="field-heading">
        <label for="model">Model</label>
        <button id="reset-context" type="button" title="Clear conversations in all tabs and reset context usage" disabled>Reset context</button>
      </div>
      <select id="model" disabled></select>
    </div>

    <div id="context" class="context" hidden>
      <div id="context-text"></div>
      <meter id="context-meter" min="0" max="1" value="0" aria-label="Context usage" hidden></meter>
      <div class="context-note">Last completed request · context set in Ollama</div>
    </div>

    <div class="actions">
      <button
        id="stop"
        class="stop"
        type="button"
        title="Abort all model requests and unload the model from memory"
        hidden
      >
        ■ Stop
      </button>
      <button id="translate" class="primary" type="button" disabled>Translate page</button>
      <button id="original" type="button" hidden>Show original</button>
    </div>
    <p id="progress" class="note" hidden></p>
    <p id="note" class="note" role="status" hidden></p>

    <div class="actions">
      <button id="summary" type="button" disabled>Summary</button>
      <button id="ask" type="button" title="Ask questions without a summary" disabled>Ask</button>
    </div>
    <p id="summary-note" class="note" hidden></p>
  </body>
</html>
